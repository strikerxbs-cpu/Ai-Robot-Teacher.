<!doctype html><html lang="bn"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css"><title>AI Robo Teacher</title></head><body>
<header class="hero"><div class="robot">🤖</div><h1>AI Robo Teacher</h1><p>তোমার Smart Virtual Teacher</p><div class="badge">📚 Learn • Practice • Quiz • Improve</div></header>
<main class="container">
<section class="card"><h2>🤖 Robo Teacher-কে প্রশ্ন করো</h2><textarea id="studentQuestion" placeholder="যেমন: সালোকসংশ্লেষণ কী? HTML কী?"></textarea>
<button class="primary-btn" onclick="askTeacher()">✨ Explanation দাও</button>
<div id="teacherAnswer" class="answer-box" style="display:none"><h3>👨‍🏫 Robo Teacher বলছে:</h3><p id="teacherAnswerText"></p><button class="voice-btn" onclick="speakTeacherAnswer()">🔊 শুনুন</button></div></section>
<section class="card"><h2>🎯 Smart Quiz</h2><select id="subjectSelect">
<option value="bangla">বাংলা</option><option value="english">English</option><option value="math">গণিত</option><option value="science">বিজ্ঞান</option><option value="ict">ICT</option><option value="bgs">বাংলাদেশ ও বিশ্বপরিচয়</option></select>
<div class="quiz-buttons"><button onclick="startQuiz(10)">১০ প্রশ্ন</button><button onclick="startQuiz(20)">২০ প্রশ্ন</button><button onclick="startQuiz(50)">৫০ প্রশ্ন</button><button class="big-quiz" onclick="startQuiz(৬0)">🏆 ৬০ প্রশ্ন</button></div></section>
<section id="quizArea" class="card" style="display:none"><div class="quiz-top"><span id="questionNumber"></span><span id="scoreDisplay">Score: 0</span></div>
<div class="progress"><div id="progressBar"></div></div><h2 id="question"></h2><div id="options"></div>
<div id="explanation" class="explanation" style="display:none"><h3>💡 Explanation</h3><p id="explanationText"></p></div>
<button id="nextButton" class="primary-btn" onclick="nextQuestion()" style="display:none">➡️ পরের প্রশ্ন</button></section>
<section id="resultArea" class="card result-card" style="display:none"><div class="trophy">🏆</div><h2>Quiz শেষ!</h2><h3 id="resultText"></h3>
<div class="result-grid"><div><strong id="correctCount">0</strong><span>সঠিক</span></div><div><strong id="wrongCount">0</strong><span>ভুল</span></div><div><strong id="percentage">0%</strong><span>Result</span></div></div>
<button class="primary-btn" onclick="restartQuiz()">🔄 আবার Quiz দাও</button></section></main>
<footer>🤖 AI Robo Teacher<br>Made for Smart Learning 🚀</footer><script src="script.js"></script><script src="bangla.js"></script>
<script src="english.js"></script>
<script src="math.js"></script>
<script src="science.js"></script>
<script src="ict.js"></script>
<script src="bgs.js"></script>
<script src="script.js"></script></body></html>acher
